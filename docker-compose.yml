# Local dev services. Start: npm run dev:services. Stop: npm run dev:services:stop.
services:
  mailpit:
    # Catch-all SMTP server: stores mail locally and never relays it.
    image: axllent/mailpit:v1.33.1
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # Web UI and HTTP API
